# GoReleaser config. Check it with `goreleaser check`, and build every target
# locally with `goreleaser build --snapshot --clean`.
version: 2

project_name: fftui

builds:
  - id: fftui
    main: ./cmd/fftui
    binary: fftui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - linux_amd64
      - linux_arm64
      - linux_arm_6
      - linux_arm_7
      - linux_386
      - linux_riscv64
      - linux_ppc64le
      - linux_s390x
      - linux_loong64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64
      - windows_386
      - freebsd_amd64
      - freebsd_arm64
      - freebsd_386
      - freebsd_arm_7
      - openbsd_amd64
      - openbsd_arm64
      - openbsd_386
      - openbsd_arm_7
      - netbsd_amd64
      - netbsd_arm64
      - netbsd_386
      - netbsd_arm_7
      - dragonfly_amd64
      - illumos_amd64
      - solaris_amd64

universal_binaries:
  - replace: false

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
